#################################
#       基础设置                #
#################################
backend = "glx";          # 使用 GLX 后端，性能更好
glx-no-stencil = true;    # 禁用模板缓冲
glx-no-rebind-pixmap = true; # 修复某些驱动程序问题
use-damage = true;        # 减少重绘，提高性能
vsync = true;             # 垂直同步，防止撕裂
refresh-rate = 0;         # 0 表示自动检测

#################################
#       阴影效果                #
#################################
# 启用阴影
shadow = true;
# 阴影设置
shadow-radius = 24;              # 阴影半径（更大=更模糊）
shadow-opacity = 0.75;           # 阴影不透明度
shadow-offset-x = -15;           # X 轴偏移
shadow-offset-y = -15;           # Y 轴偏移
shadow-red = 0.0;                # 阴影红色分量
shadow-green = 0.0;              # 阴影绿色分量
shadow-blue = 0.0;               # 阴影蓝色分量

# 排除阴影的窗口
shadow-exclude = [
    "name = 'Notification'",     # 通知
    "class_g = 'Conky'",         # Conky 系统监控
    "class_g ?= 'Notify-osd'",   # 通知守护进程
    "class_g = 'Cairo-clock'",   # 时钟应用
    "_GTK_FRAME_EXTENTS@:c",     # GTK 窗口边框
    "_NET_WM_STATE@:32a *= '_NET_WM_STATE_HIDDEN'", # 隐藏窗口
    "window_type = 'dock'",      # Dock 栏
    "window_type = 'desktop'"    # 桌面
];

#################################
#       模糊效果                #
#################################
# 方法1：Dual Kawase 模糊（高性能）
blur: {
    method = "dual_kawase";      # 双重高斯模糊算法
    strength = 8;                # 模糊强度 (0-20)
    background = true;           # 模糊背景
    background-frame = true;     # 模糊窗口背景
    background-fixed = true;     # 固定背景模糊
}

# 方法2：高斯模糊（更柔和，但性能要求高）
# blur: {
#     method = "gaussian";
#     size = 25;                 # 模糊核大小
#     deviation = 5.0;           # 标准差
# }

# 排除模糊的窗口
blur-background-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "class_g = 'rofi'",          # Rofi 启动器
    "class_g = 'Polybar'",       # Polybar 状态栏
    "class_g = 'Dunst'",         # Dunst 通知
    "_GTK_FRAME_EXTENTS@:c"
];

#################################
#       透明度效果              #
#################################
# 全局透明度
inactive-opacity = 0.85;         # 非活动窗口透明度
active-opacity = 1.0;            # 活动窗口透明度
frame-opacity = 0.9;             # 窗口边框透明度
inactive-opacity-override = false; # 不覆盖窗口设置

# 透明度规则
opacity-rule = [
    "90:class_g = 'Alacritty' && focused",    # 聚焦的 Alacritty
    "80:class_g = 'Alacritty' && !focused",   # 未聚焦的 Alacritty
    "95:class_g = 'code' && focused",         # VS Code 聚焦时
    "85:class_g = 'code' && !focused",        # VS Code 未聚焦
    "100:class_g = 'firefox'",                # Firefox 不透明
    "100:class_g = 'Google-chrome'",          # Chrome 不透明
    "100:class_g = 'Thunar'",                 # 文件管理器不透明
    "0:_NET_WM_STATE@[0]:32a = '_NET_WM_STATE_HIDDEN'", # 隐藏窗口
    "0:_NET_WM_STATE@[1]:32a = '_NET_WM_STATE_HIDDEN'",
    "0:_NET_WM_STATE@[2]:32a = '_NET_WM_STATE_HIDDEN'",
    "0:_NET_WM_STATE@[3]:32a = '_NET_WM_STATE_HIDDEN'",
    "0:_NET_WM_STATE@[4]:32a = '_NET_WM_STATE_HIDDEN'"
];

#################################
#       圆角效果                #
#################################
# 启用圆角
corner-radius = 16;              # 圆角半径（像素）

# 圆角排除列表
rounded-corners-exclude = [
    "window_type = 'dock'",      # Dock 栏不要圆角
    "window_type = 'desktop'",   # 桌面不要圆角
    "class_g = 'Polybar'",       # 状态栏
    "class_g = 'rofi'",          # 启动器
    "class_g = 'Dunst'",         # 通知
    "BW = 0",                    # 无边框窗口
    "border_width = 0"           # 无边框窗口
];

#################################
#       动画效果                #
#################################
# 启用动画
animations = true;
animation-stiffness = 300.0;     # 动画刚度（弹簧效果）
animation-window-mass = 0.8;     # 窗口质量（惯性效果）
animation-dampening = 35.0;      # 阻尼系数
animation-clamping = true;       # 限制动画范围

# 窗口打开动画
animation-for-open-window = "zoom";          # 缩放动画
animation-for-unmap-window = "slide-down";   # 最小化动画

# 窗口切换动画
animation-for-next-tag = "slide-left";       # 切换到下一个标签页
animation-for-prev-tag = "slide-right";      # 切换到上一个标签页

# 动画过渡
transition-length = 300;         # 动画时长（毫秒）
transition-pow-x = 0.1;          # X 轴过渡曲线
transition-pow-y = 0.1;          # Y 轴过渡曲线
transition-pow-w = 0.1;          # 宽度过渡曲线
transition-pow-h = 0.1;          # 高度过渡曲线

# 动画排除列表
animation-exclude = [
    "class_g = 'Dunst'",         # 通知无动画
    "class_g = 'rofi'",          # 启动器无动画
    "window_type = 'dropdown_menu'",
    "window_type = 'popup_menu'",
    "window_type = 'tooltip'"
];

#################################
#       其他特效                #
#################################
# 淡入淡出效果
fading = true;                   # 启用淡入淡出
fade-delta = 10;                 # 淡入淡出步数
fade-in-step = 0.03;             # 淡入速度
fade-out-step = 0.03;            # 淡出速度
fade-exclude = [];

# 窗口渐变
wintypes:
{
    tooltip = { fade = true; shadow = true; opacity = 0.85; focus = true; };
    dock = { shadow = false; opacity = 0.9; };
    dnd = { shadow = false; };
    popup_menu = { opacity = 0.95; };
    dropdown_menu = { opacity = 0.95; };
    menu = { opacity = 0.95; };
    dialog = { opacity = 0.95; };
    utility = { opacity = 0.9; };
    normal = { opacity = 0.95; };
};

# 3D 变换（实验性）
experimental-backends = false;   # 谨慎启用

# 颜色变换
invert-color-include = [];       # 颜色反转排除列表

#################################
#       性能优化                #
#################################
# 修复撕裂
sw-opti = true;                  # 软件优化
xrender-sync-fence = true;       # XRender 同步

# 窗口重定向
unredir-if-possible = true;      # 全屏时禁用合成
unredir-if-possible-exclude = [];

# 检测客户端开销
detect-client-leader = true;     # 检测客户端领导窗口
detect-transient = true;         # 检测瞬态窗口
detect-client-opacity = true;    # 检测客户端透明度

# 形状变换
no-ewmh-fullscreen = false;      # 允许 EWMH 全屏
mark-wmwin-focused = true;       # 标记 WM 窗口为聚焦
mark-ovredir-focused = true;     # 标记重定向为聚焦

#################################
#       排除列表                #
#################################
# 不启用合成的窗口类型
no-dock-shadow = true;           # Dock 无阴影
no-dnd-shadow = true;            # 拖拽无阴影
clear-shadow = true;             # 清除阴影
shadow-ignore-shaped = false;    # 不忽略形状窗口

# 透明排除列表
focus-exclude = [
    "class_g = 'Cairo-clock'",
    "class_g = 'Bar'",           # 状态栏
    "class_g ?= 'rofi'",         # Rofi
    "class_g = 'slop'"           # 区域选择器
];

# 性能排除列表
paint-on-overlay = true;         # 在覆盖层上绘制
log-level = "warn";              # 日志级别
