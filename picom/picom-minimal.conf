# 基础设置
backend = "glx";
use-damage = true;
vsync = true;

# 阴影效果
shadow = true;
shadow-radius = 12;
shadow-offset-x = -5;
shadow-offset-y = -5;
shadow-opacity = 0.6;

# 模糊效果
blur: {
    method = "dual_kawase";
    strength = 5;
}

# 透明度
inactive-opacity = 0.9;
active-opacity = 1.0;

# 圆角
corner-radius = 8;

# 动画
animations = true;
animation-for-open-window = "zoom";

# 排除列表
shadow-exclude = [
    "class_g = 'Dunst'",
    "window_type = 'dock'"
];

blur-background-exclude = [
    "window_type = 'dock'",
    "class_g = 'rofi'"
];

rounded-corners-exclude = [
    "window_type = 'dock'",
    "class_g = 'rofi'"
];
